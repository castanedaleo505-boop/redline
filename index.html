<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redline</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redline">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="hd" id="hd"></header>
  <main id="list"></main>
  <footer id="ft"></footer>
</div>
<div id="tbar"></div>
<div id="cam" role="dialog" aria-label="Photo check-in"></div>
<div id="viewer" role="dialog" aria-label="Photo viewer"></div>
<div id="sheet" role="dialog" aria-label="Tools"></div>
<noscript><p style="padding:24px;color:#f5f5f5;font-family:system-ui">Redline needs JavaScript turned on.</p></noscript>
<script src="app.js"></script>

</html>
